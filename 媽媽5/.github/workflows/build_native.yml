name: Build & Sign Native Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'phone_proxy_app/native/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        working-directory: phone_proxy_app/native
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        run: |
          APK=$(find phone_proxy_app/native/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK"
          # 生成签名密钥
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          # 用 apksigner 签名
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK"
          cp "$APK" app-signed.apk
          echo "Signed APK ready"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-proxy-signed
          path: app-signed.apk
          retention-days: 90
